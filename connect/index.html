<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Connect</title>
  <meta name="description" content="Connect is a friendly social network for sharing moments, chatting with friends and finding what's happening nearby.">
  <meta name="theme-color" content="#FFFFFF">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    /* Apply the saved theme before first paint to avoid a flash. */
    (function () {
      var t = 'light';
      try {
        var saved = localStorage.getItem('connect:theme');
        t = saved ? JSON.parse(saved) : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      } catch (e) {}
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>

  <a class="skip-link" href="#main">Skip to content</a>

  <header class="topbar">
    <div class="topbar__left">
      <button class="icon-btn menu-btn" data-action="open-drawer" aria-label="Open menu"><svg class="icon" aria-hidden="true"><use href="#i-menu"></use></svg></button>
      <a class="brand" href="#/feed" aria-label="Connect home">
        <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#0F766E"/><path d="M21.5 10.2a7.6 7.6 0 1 0 0 11.6" stroke="#fff" stroke-width="3.2" fill="none" stroke-linecap="round"/><circle cx="23" cy="16" r="2.6" fill="#F2A33A"/></svg>
        <span class="brand__name">Connect</span>
      </a>
      <div class="search" role="search">
        <div class="search__field">
          <button class="icon-btn search-close" type="button" data-action="close-search" aria-label="Close search"><svg class="icon" aria-hidden="true"><use href="#i-arrow-left"></use></svg></button>
          <svg class="icon icon--sm search__icon" aria-hidden="true"><use href="#i-search"></use></svg>
          <input id="searchInput" type="search" placeholder="Search Connect" autocomplete="off" aria-label="Search people, groups and posts" aria-controls="dd-search" aria-expanded="false">
          <kbd class="search__kbd" aria-hidden="true">/</kbd>
        </div>
        <div class="dropdown dropdown--search" id="dd-search"></div>
      </div>
    </div>

    <nav class="topnav" aria-label="Primary">
      <a class="topnav__link" href="#/feed" data-nav="feed" aria-label="Home" data-tip="Home"><span class="topnav__inner"><svg class="icon" aria-hidden="true"><use href="#i-home"></use></svg></span></a>
      <a class="topnav__link" href="#/friends" data-nav="friends" aria-label="Friends" data-tip="Friends"><span class="topnav__inner"><svg class="icon" aria-hidden="true"><use href="#i-users"></use></svg><span class="badge" data-badge="requests" hidden></span></span></a>
      <a class="topnav__link" href="#/messages" data-nav="messages" aria-label="Messages" data-tip="Messages"><span class="topnav__inner"><svg class="icon" aria-hidden="true"><use href="#i-chat"></use></svg><span class="badge" data-badge="messages" hidden></span></span></a>
      <a class="topnav__link" href="#/groups" data-nav="groups" aria-label="Groups" data-tip="Groups"><span class="topnav__inner"><svg class="icon" aria-hidden="true"><use href="#i-group"></use></svg></span></a>
    </nav>

    <div class="topbar__right">
      <button class="icon-btn icon-btn--filled search-toggle" data-action="open-search" aria-label="Search"><svg class="icon" aria-hidden="true"><use href="#i-search"></use></svg></button>
      <button class="icon-btn icon-btn--filled hide-sm" id="themeBtn" data-action="toggle-theme" aria-label="Toggle dark mode"></button>
      <div class="dd-wrap">
        <button class="icon-btn icon-btn--filled" data-action="dropdown" aria-controls="dd-notifs" aria-expanded="false" aria-haspopup="true" aria-label="Notifications">
          <svg class="icon" aria-hidden="true"><use href="#i-bell"></use></svg><span class="badge" data-badge="notifs" hidden></span>
        </button>
        <div class="dropdown" id="dd-notifs" aria-label="Notifications"></div>
      </div>
      <div class="dd-wrap">
        <button class="avatar-btn" id="navAvatar" data-action="dropdown" aria-controls="dd-account" aria-expanded="false" aria-haspopup="true" aria-label="Account and settings"></button>
        <div class="dropdown dropdown--account" id="dd-account" aria-label="Account"></div>
      </div>
    </div>
  </header>

  <div class="drawer-backdrop" data-action="close-drawer"></div>

  <div class="layout">
    <aside class="sidebar sidebar-left" id="sidebarLeft" aria-label="Main menu"></aside>
    <main id="main" class="main" tabindex="-1"></main>
    <aside class="sidebar sidebar-right" id="sidebarRight" aria-label="Contacts and suggestions"></aside>
  </div>

  <nav class="bottom-nav" aria-label="Mobile navigation">
    <a class="bn-item" href="#/feed" data-nav="feed"><svg class="icon" aria-hidden="true"><use href="#i-home"></use></svg><span class="bn-label">Home</span></a>
    <a class="bn-item" href="#/friends" data-nav="friends"><svg class="icon" aria-hidden="true"><use href="#i-users"></use></svg><span class="bn-label">Friends</span><span class="badge" data-badge="requests" hidden></span></a>
    <button class="bn-item bn-create" data-action="open-composer" aria-label="Create post"><span class="bn-create__btn"><svg class="icon" aria-hidden="true"><use href="#i-plus"></use></svg></span></button>
    <a class="bn-item" href="#/messages" data-nav="messages"><svg class="icon" aria-hidden="true"><use href="#i-chat"></use></svg><span class="bn-label">Chats</span><span class="badge" data-badge="messages" hidden></span></a>
    <button class="bn-item" data-action="open-drawer"><svg class="icon" aria-hidden="true"><use href="#i-menu"></use></svg><span class="bn-label">Menu</span></button>
  </nav>

  <div id="toastRoot" class="toast-root" aria-live="polite"></div>

  <noscript><p class="noscript">Connect needs JavaScript to run. Please enable it and reload the page.</p></noscript>
  <script src="js/app.js"></script>
</body>
</html>
