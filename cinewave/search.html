<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Search · CineWave</title>
<meta name="description" content="CineWave — a fictional streaming service demo: movies, TV series, kids mode and a custom video player, built with HTML, CSS and vanilla JavaScript.">
<meta name="theme-color" content="#0b0d14">
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<script>try{var t=localStorage.getItem("cw:theme");document.documentElement.dataset.theme=t?JSON.parse(t):"dark"}catch(e){}</script>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/features.css">
</head>
<body data-page="search">
<header class="site-header" id="site-header"></header>
<main id="main" class="container page">
  <h1 class="sr-only">Search</h1>
  <form class="search-bar" id="search-form" role="search">
    <div class="sb-input"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="q" name="q" type="search" placeholder="Search title, actor, director, genre, country or year" aria-label="Search" autocomplete="off">
      <div class="suggest" id="q-suggest" role="listbox" hidden></div></div>
    <button class="btn btn-primary" type="submit">Search</button>
    <button class="btn btn-ghost only-compact" type="button" id="filter-toggle" aria-expanded="false" aria-controls="filters">Filters</button>
  </form>
  <div class="search-layout">
    <aside class="filters-side" id="filters" aria-label="Search filters"></aside>
    <section aria-label="Search results" aria-live="polite">
      <p class="result-info" id="result-info"></p>
      <div id="idle"></div>
      <div id="results"></div>
    </section>
  </div>
</main>
<footer class="site-footer" id="site-footer"></footer>
<script src="js/storage.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/search.js"></script>
</body>
</html>
