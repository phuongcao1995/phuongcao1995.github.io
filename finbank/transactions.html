<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Transactions — FinBank</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="transactions" data-title="Transactions">
<div id="page">
<style>
  .tx-list { display: none; }
  .tx-actions { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
  .tx-pending-bar { display: flex; gap: 6px; padding: 0 8px 10px 64px; flex-wrap: wrap; border-bottom: 1px solid var(--border); }
  .tx-list .row-item { border-bottom: 0; }
  .tx-list .row-item[data-tx].has-bar { padding-bottom: 4px; }
  .table th.sortable .arr { opacity: .7; }
  @media (max-width: 640px) {
    .tx-table { display: none; }
    .tx-list { display: block; }
    .tx-tools .btn { flex: 1; }
  }
</style>
<div class="page-head">
  <div><h1>Transactions</h1><p>Search, filter, review and export everything that moved through your accounts.</p></div>
  <div class="flex gap-1 wrap tx-tools">
    <button class="btn btn-outline" id="exPdf">🖨️ Export PDF</button>
    <button class="btn" id="exCsv">⬇️ Export CSV</button>
  </div>
</div>
<div class="grid g3 mb-2" id="summary"></div>
<section class="card mb-2">
  <div class="toolbar">
    <input class="input grow" id="q" type="search" placeholder="Search description, reference, counterparty…" aria-label="Search transactions">
    <select class="select" id="fSort" aria-label="Sort by"><option value="date-desc">Newest first</option><option value="date-asc">Oldest first</option><option value="amt-desc">Amount: high to low</option><option value="amt-asc">Amount: low to high</option></select>
  </div>
  <div class="toolbar" style="margin-bottom:0">
    <input class="input" type="date" id="fFrom" aria-label="From date" title="From date">
    <input class="input" type="date" id="fTo" aria-label="To date" title="To date">
    <select class="select" id="fCat" aria-label="Category"></select>
    <select class="select" id="fType" aria-label="Type"><option value="">In &amp; out</option><option value="in">Money in</option><option value="out">Money out</option></select>
    <select class="select" id="fAcc" aria-label="Account"></select>
    <select class="select" id="fStatus" aria-label="Status"><option value="">All statuses</option><option>Completed</option><option>Pending</option><option>Failed</option><option>Cancelled</option></select>
  </div>
  <div class="chips mt-2" id="chips"></div>
</section>
<section class="card" id="results" aria-live="polite"></section>
<div id="pager" class="mt-1"></div>
</div>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/transactions.js"></script>
</body>
</html>
