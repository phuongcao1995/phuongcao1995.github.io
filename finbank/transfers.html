<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transfers — FinBank</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/responsive.css"></head>
<body data-page="transfers" data-title="Transfers"><div id="page">
  <div class="page-head"><div><h1>Transfers</h1><p>Send money to FinBank and other banks in seconds, 24/7 — or abroad.</p></div></div>
  <div class="grid g-main">
    <div>
      <div class="tabs" role="tablist">
        <button class="tab active" data-tab="fb" role="tab">FinBank account</button>
        <button class="tab" data-tab="other" role="tab">Other bank</button>
        <button class="tab" data-tab="bene" role="tab">Saved beneficiaries</button>
        <button class="tab" data-tab="intl" role="tab">International</button>
      </div>
      <div class="card" id="wizCard">
        <div class="steps" id="steps"></div>
        <div id="wiz"></div>
      </div>
      <div class="card tab-panel" data-panel="bene">
        <div class="card-head"><h3>Saved beneficiaries</h3><button class="btn btn-sm" id="addBene">＋ Add beneficiary</button></div>
        <div class="toolbar"><input type="search" class="input grow" id="beneQ" placeholder="Search by name, alias, bank or account…" aria-label="Search beneficiaries"></div>
        <div class="list" id="beneList"></div>
      </div>
    </div>
    <div class="grid" style="align-content:start">
      <div class="card"><div class="card-head"><h3>Recent transfers</h3><a href="transactions.html">View all</a></div><div class="list" id="recent"></div></div>
      <div class="card"><div class="card-head"><h3>Scheduled transfers</h3><span class="badge" id="schedCount">0</span></div><div class="list" id="sched"></div></div>
    </div>
  </div>
</div>
<script src="js/data.js"></script><script src="js/app.js"></script><script src="js/transfers.js"></script></body></html>
