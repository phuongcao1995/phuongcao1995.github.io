<!DOCTYPE html>
<html lang="en" data-theme="light" data-hints="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lesson — EnglishUp</title>
<meta name="description" content="Interactive lesson player.">
<meta name="theme-color" content="#4F46E5">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%234F46E5'/%3E%3Cpath d='M9 21.5V11a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-8.5z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  /* Apply saved theme before paint to avoid a flash */
  try { var st = JSON.parse(localStorage.getItem('englishup_state') || 'null');
    if (st && st.settings) { document.documentElement.setAttribute('data-theme', st.settings.dark ? 'dark' : 'light'); document.documentElement.setAttribute('data-hints', st.settings.hints || 'vi'); }
  } catch (e) {}
</script>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="lesson">
<main class="main" id="main" tabindex="-1">

<div class="lesson-mobile-bar"><button class="btn btn-secondary btn-sm" id="toggle-lesson-nav" aria-expanded="false" aria-controls="lesson-nav">☰ All lessons</button></div>
<div class="lesson-layout">
  <nav class="card lesson-nav" id="lesson-nav" aria-label="Course lessons"></nav>
  <div class="lesson-main" id="lesson-main"></div>
  <aside class="lesson-side" id="lesson-side" aria-label="Lesson progress"></aside>
</div>
</main>
<noscript><p style="padding:20px">EnglishUp needs JavaScript enabled to work.</p></noscript>
<script src="js/utils.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/lessons.js"></script>
</body>
</html>
