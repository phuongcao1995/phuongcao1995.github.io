<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peter Cao · UI Project Showcase</title>
<meta name="description" content="A collection of front-end UI demo projects by Peter Cao.">
<style>
  :root {
    --bg: #f7f8fa;
    --surface: #ffffff;
    --border: #e5e7eb;
    --text: #1a1d23;
    --muted: #6b7280;
    --accent: #3b5bfd;
    --accent-tint: #eef1ff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  }

  header {
    max-width: 1100px;
    margin: 0 auto;
    padding: 64px 24px 24px;
    text-align: center;
  }

  header h1 {
    margin: 0 0 12px;
    font-size: clamp(28px, 4vw, 40px);
    letter-spacing: -0.02em;
  }

  header p {
    margin: 0 auto;
    max-width: 620px;
    color: var(--muted);
    font-size: 16px;
    line-height: 1.6;
  }

  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 32px 24px 80px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 20px;
  }

  .card {
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    text-decoration: none;
    color: var(--text);
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  }

  .card:hover {
    border-color: var(--accent);
    box-shadow: 0 8px 20px rgba(16, 24, 40, 0.08);
    transform: translateY(-3px);
  }

  .card .tag {
    align-self: flex-start;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--accent);
    background: var(--accent-tint);
    padding: 4px 10px;
    border-radius: 999px;
    margin-bottom: 14px;
  }

  .card h2 {
    margin: 0 0 10px;
    font-size: 20px;
  }

  .card p {
    margin: 0;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.55;
    flex-grow: 1;
  }

  .card .link {
    margin-top: 18px;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
  }

  footer {
    text-align: center;
    padding: 24px;
    color: var(--muted);
    font-size: 13px;
  }

  footer a { color: var(--muted); }
</style>
</head>
<body>

<header>
  <h1>UI Project Showcase</h1>
  <p>A collection of front-end demo projects — static HTML, CSS and vanilla JavaScript, no backend required. Click any project to open its live demo.</p>
</header>

<main>
  <div class="grid" id="project-grid"></div>
</main>

<footer>
  <a href="https://github.com/phuongcao1995" target="_blank" rel="noopener">github.com/phuongcao1995</a>
</footer>

<script src="projects.js"></script>
<script>
  const grid = document.getElementById("project-grid");

  grid.innerHTML = PROJECTS.map(p => `
    <a class="card" href="${p.href}">
      <span class="tag">${p.tag}</span>
      <h2>${p.title}</h2>
      <p>${p.description}</p>
      <span class="link">Open demo →</span>
    </a>
  `).join("");
</script>

</body>
</html>
